services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: finperf-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-FinPerf_Dev_2026!}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Crea la base FinPerf y carga los datos la primera vez; luego termina.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-FinPerf_Dev_2026!}"
      # 1 = autoriza eliminar y recargar una base en estado ambiguo (ver init.sh)
      FINPERF_RECREATE: "${FINPERF_RECREATE:-0}"
    volumes:
      - ./db:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

  # Aplica db/migrations/ (índices, tabla pre-agregada, consultas de la API).
  # Para medir el "antes", levantar solo: docker compose up -d sqlserver db-init
  db-migrate:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-FinPerf_Dev_2026!}"
    volumes:
      - ./db:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/migrate.sh"]
    restart: "no"

volumes:
  sqldata:
